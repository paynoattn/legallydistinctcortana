name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gates (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `make mutate SCOPE=changed` can diff against the PR base.
          fetch-depth: 0

      # Tauri's Linux runtime (WebKitGTK), tray/appindicator, xdo (enigo), and ALSA (cpal).
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev jq

      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Prebuilt binaries; `make setup` then finds the pinned versions and skips `cargo install`.
      # Keep these versions in sync with CARGO_TOOLS in the Makefile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-deny@0.20.2

      - run: make setup
      - run: node_modules/.bin/playwright install-deps chromium
      - run: make check qa

      - name: Mutation testing on changed code
        if: github.event_name == 'pull_request'
        run: make mutate SCOPE=changed BASE=origin/${{ github.base_ref }}

      - name: Keep mutation reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: |
            mutants.out
            reports/mutation
          if-no-files-found: ignore

  windows:
    name: desktop build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clippy and tests on the Windows target
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --lib --bins --locked
      - name: Tauri bundle (no signing)
        run: node_modules/.bin/tauri build --no-bundle
