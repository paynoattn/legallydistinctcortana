# Dependency rules, checked by `make arch` (cargo xtask arch) against `cargo metadata`.
#
# Layering: http-api -> application -> domain; infrastructure -> application, domain.
# Only the composition roots (`app` headless, `desktop` Tauri) wire infrastructure into
# application. Only `desktop` may depend on tauri.
#
#   allow = workspace crates this crate may depend on (normal, dev, or build).
#   ban   = external crates this crate must not depend on, directly or transitively
#           through normal/build dependencies.
# Every workspace crate must appear here. Fix violations in code, not in this file.

no_dependents = ["app", "desktop", "xtask"]

[crates.tasks-domain]
allow = []
ban = [
  "axum", "hyper", "tower", "tower-http", "tokio", "serde_json", "sqlx", "reqwest",
  "uuid", "tracing", "tauri",
]

[crates.tasks-application]
allow = ["tasks-domain"]
ban = [
  "axum", "hyper", "tower", "tower-http", "tokio", "serde_json", "sqlx", "reqwest", "uuid",
  "tauri",
]

[crates.tasks-infrastructure]
allow = ["tasks-application", "tasks-domain"]
ban = ["axum", "hyper", "tower", "tower-http", "tauri"]

[crates.http-api]
allow = ["tasks-application", "tasks-domain"]
ban = ["sqlx", "reqwest", "uuid", "tauri"]

[crates.app]
allow = ["http-api", "tasks-application", "tasks-domain", "tasks-infrastructure"]

# Shared kernel: value types only.
[crates.kernel]
allow = []
ban = ["tokio", "serde_json", "reqwest", "tauri", "cpal", "arboard", "enigo", "windows"]

# OS capabilities as ports (application layer, shared by every context).
[crates.platform-ports]
allow = []
ban = ["tokio", "serde_json", "reqwest", "tauri", "cpal", "arboard", "enigo", "windows"]

# Desktop adapters for platform-ports on safe, cross-platform crates.
[crates.platform-desktop]
allow = ["platform-ports"]
ban = ["tauri", "cpal", "serde_json"]

[crates.speech-domain]
allow = ["kernel"]
ban = ["tokio", "serde_json", "reqwest", "tauri", "cpal", "arboard", "enigo", "windows"]

[crates.speech-application]
allow = ["kernel", "platform-ports", "speech-domain"]
ban = ["tokio", "serde_json", "reqwest", "tauri", "cpal", "arboard", "enigo", "windows"]

[crates.speech-infrastructure]
allow = ["kernel", "platform-ports", "speech-application", "speech-domain"]
ban = ["tauri", "arboard", "enigo"]

# Tauri shell: composition root for the desktop UI host. Only it may depend on tauri.
[crates.desktop]
allow = ["kernel", "platform-desktop", "platform-ports", "speech-application", "speech-infrastructure"]

[crates.xtask]
allow = []
