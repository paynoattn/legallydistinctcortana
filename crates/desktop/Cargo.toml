[package]
name = "desktop"
description = "Desktop shell: Tauri window, tray, and the composition root for the UI host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
kernel.workspace = true
platform-desktop.workspace = true
platform-ports.workspace = true
serde.workspace = true
speech-application.workspace = true
speech-infrastructure.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
